<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background circle -->
  <circle cx="64" cy="64" r="64" fill="#1a1a1a"/>

  <!-- Inner glow circle -->
  <circle cx="64" cy="64" r="58" fill="#2a2a2a"/>

  <!-- Monster body (red) -->
  <ellipse cx="64" cy="68" rx="32" ry="36" fill="#ff3333">
    <animate attributeName="ry" values="36;38;36" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Monster eyes -->
  <ellipse cx="54" cy="58" rx="6" ry="8" fill="#fff"/>
  <ellipse cx="74" cy="58" rx="6" ry="8" fill="#fff"/>
  <circle cx="54" cy="60" r="4" fill="#000">
    <animate attributeName="r" values="4;3;4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="60" r="4" fill="#000">
    <animate attributeName="r" values="4;3;4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Monster horns -->
  <path d="M 45 50 Q 40 35 38 28 L 42 30 Q 44 40 47 48 Z" fill="#cc0000"/>
  <path d="M 83 50 Q 88 35 90 28 L 86 30 Q 84 40 81 48 Z" fill="#cc0000"/>

  <!-- Monster mouth (scary) -->
  <path d="M 50 72 Q 64 80 78 72" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Fangs -->
  <polygon points="56,72 58,78 60,72" fill="#fff"/>
  <polygon points="68,72 70,78 72,72" fill="#fff"/>

  <!-- Monster spikes on back -->
  <path d="M 40 75 L 35 70 L 38 78 Z" fill="#cc0000"/>
  <path d="M 88 75 L 93 70 L 90 78 Z" fill="#cc0000"/>
  <path d="M 42 85 L 37 82 L 40 90 Z" fill="#cc0000"/>
  <path d="M 86 85 L 91 82 L 88 90 Z" fill="#cc0000"/>

  <!-- Sword crossing (bottom right) -->
  <g transform="translate(85, 85) rotate(45)">
    <!-- Sword blade -->
    <rect x="-2" y="-15" width="4" height="28" fill="#88ccff"/>
    <polygon points="-2,-15 0,-20 2,-15" fill="#aaddff"/>

    <!-- Sword handle -->
    <rect x="-1" y="13" width="2" height="6" fill="#8b4513"/>

    <!-- Sword guard -->
    <rect x="-6" y="12" width="12" height="2" fill="#d4af37"/>
  </g>

  <!-- Error symbol (top left corner) -->
  <circle cx="28" cy="28" r="12" fill="#ff3333" opacity="0.8"/>
  <text x="28" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">!</text>

  <!-- Breathing animation glow -->
  <ellipse cx="64" cy="68" rx="32" ry="36" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </ellipse>
</svg>
