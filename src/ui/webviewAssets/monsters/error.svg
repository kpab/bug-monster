<!-- Error Monster - Aggressive red creature with fangs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="180" rx="60" ry="15" fill="#000" opacity="0.2">
    <animate attributeName="rx" values="60;70;60" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Body -->
  <g id="body">
    <circle cx="100" cy="100" r="60" fill="#ff3333">
      <animate attributeName="r" values="60;65;60" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Spikes on top -->
    <polygon points="80,50 85,30 90,50" fill="#cc0000">
      <animateTransform attributeName="transform" type="rotate" from="0 85 40" to="10 85 40" dur="0.5s" repeatCount="indefinite" direction="alternate"/>
    </polygon>
    <polygon points="95,40 100,20 105,40" fill="#cc0000">
      <animateTransform attributeName="transform" type="rotate" from="0 100 30" to="-10 100 30" dur="0.6s" repeatCount="indefinite" direction="alternate"/>
    </polygon>
    <polygon points="110,50 115,30 120,50" fill="#cc0000">
      <animateTransform attributeName="transform" type="rotate" from="0 115 40" to="10 115 40" dur="0.5s" repeatCount="indefinite" direction="alternate"/>
    </polygon>

    <!-- Eyes -->
    <g id="eyes">
      <ellipse cx="80" cy="85" rx="12" ry="18" fill="#fff"/>
      <ellipse cx="120" cy="85" rx="12" ry="18" fill="#fff"/>
      <circle cx="82" cy="90" r="8" fill="#000">
        <animate attributeName="cy" values="90;92;90" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="118" cy="90" r="8" fill="#000">
        <animate attributeName="cy" values="90;92;90" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="84" cy="88" r="3" fill="#fff"/>
      <circle cx="120" cy="88" r="3" fill="#fff"/>
    </g>

    <!-- Angry eyebrows -->
    <path d="M 68 75 L 85 70" stroke="#990000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 132 75 L 115 70" stroke="#990000" stroke-width="4" stroke-linecap="round"/>

    <!-- Mouth with fangs -->
    <path d="M 70 115 Q 100 130 130 115" stroke="#000" stroke-width="3" fill="none"/>
    <rect x="85" y="115" width="6" height="15" fill="#fff" rx="3">
      <animate attributeName="height" values="15;20;15" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="109" y="115" width="6" height="15" fill="#fff" rx="3">
      <animate attributeName="height" values="15;20;15" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Arms -->
    <ellipse cx="50" cy="110" rx="20" ry="30" fill="#ff3333">
      <animateTransform attributeName="transform" type="rotate" from="-20 50 110" to="-30 50 110" dur="1s" repeatCount="indefinite" direction="alternate"/>
    </ellipse>
    <ellipse cx="150" cy="110" rx="20" ry="30" fill="#ff3333">
      <animateTransform attributeName="transform" type="rotate" from="20 150 110" to="30 150 110" dur="1s" repeatCount="indefinite" direction="alternate"/>
    </ellipse>

    <!-- Claws -->
    <g id="left-claw">
      <path d="M 40 125 L 35 135" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 45 130 L 40 140" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 50 128 L 47 138" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="right-claw">
      <path d="M 160 125 L 165 135" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 155 130 L 160 140" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
      <path d="M 150 128 L 153 138" stroke="#990000" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pulsing aura -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="70;80;70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
