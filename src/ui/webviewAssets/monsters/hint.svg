<!-- Hint Spirit - Glowing green spirit/fairy creature -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="spiritGlow">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF7F;stop-opacity:0.3" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft glow trail -->
  <circle cx="100" cy="100" r="50" fill="url(#spiritGlow)" opacity="0.3">
    <animate attributeName="r" values="50;60;50" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g id="spirit-body" filter="url(#softGlow)">
    <!-- Main body orb -->
    <circle cx="100" cy="100" r="35" fill="url(#spiritGlow)">
      <animate attributeName="r" values="35;38;35" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.7;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner core -->
    <circle cx="100" cy="100" r="25" fill="#90EE90" opacity="0.8">
      <animate attributeName="r" values="25;28;25" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="15" fill="#E0FFE0" opacity="0.9">
      <animate attributeName="r" values="15;17;15" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Eyes (friendly) -->
    <g id="eyes">
      <ellipse cx="90" cy="95" rx="5" ry="7" fill="#2E7D32">
        <animate attributeName="ry" values="7;6;7" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="110" cy="95" rx="5" ry="7" fill="#2E7D32">
        <animate attributeName="ry" values="7;6;7" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="91" cy="93" r="2" fill="#A5D6A7"/>
      <circle cx="111" cy="93" r="2" fill="#A5D6A7"/>
    </g>

    <!-- Smile -->
    <path d="M 92 105 Q 100 108 108 105" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Wispy arms -->
    <path d="M 70 100 Q 55 95 45 90" stroke="#90EE90" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="-15 70 100" to="-25 70 100" dur="1.5s" repeatCount="indefinite" direction="alternate"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 100 Q 145 95 155 90" stroke="#90EE90" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="15 130 100" to="25 130 100" dur="1.5s" repeatCount="indefinite" direction="alternate"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Trailing wispy tail -->
    <path d="M 100 135 Q 95 150 90 165" stroke="#90EE90" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round">
      <animate attributeName="d" values="M 100 135 Q 95 150 90 165;M 100 135 Q 105 150 110 165;M 100 135 Q 95 150 90 165" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 135 Q 100 155 100 170" stroke="#90EE90" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 135 Q 105 150 110 165" stroke="#90EE90" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round">
      <animate attributeName="d" values="M 100 135 Q 105 150 110 165;M 100 135 Q 95 150 90 165;M 100 135 Q 105 150 110 165" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sparkle particles -->
  <g id="sparkles">
    <circle cx="70" cy="70" r="2" fill="#E0FFE0">
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;60;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="75" r="2" fill="#E0FFE0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75;65;75" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="60" r="2" fill="#E0FFE0">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;50;60" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="65" r="2" fill="#E0FFE0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="65;55;65" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Star sparkles -->
    <g id="star1" opacity="0.8">
      <path d="M 60 90 L 62 92 L 60 94 L 58 92 Z" fill="#E0FFE0">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
    <g id="star2" opacity="0.8">
      <path d="M 140 85 L 142 87 L 140 89 L 138 87 Z" fill="#E0FFE0">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Floating animation -->
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite" additive="sum"/>

  <!-- Outer radiant glow -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#90EE90" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="70;80;70" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
