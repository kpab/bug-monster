<!-- ReferenceError Wraith - Ghostly semi-transparent creature -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ghostGradient">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Shadow (very faint) -->
  <ellipse cx="100" cy="180" rx="40" ry="8" fill="#000" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ghost body -->
  <g id="wraith-body" filter="url(#glow)">
    <!-- Main body shape -->
    <path d="M 100 40 Q 60 40 50 80 Q 45 120 50 140 L 50 170 Q 55 175 60 170 Q 65 160 70 170 Q 75 175 80 170 Q 85 160 90 170 Q 95 175 100 170 Q 105 160 110 170 Q 115 175 120 170 Q 125 160 130 170 Q 135 175 140 170 L 150 140 Q 155 120 150 80 Q 140 40 100 40 Z"
          fill="url(#ghostGradient)" opacity="0.85">
      <animate attributeName="d"
               values="M 100 40 Q 60 40 50 80 Q 45 120 50 140 L 50 170 Q 55 175 60 170 Q 65 160 70 170 Q 75 175 80 170 Q 85 160 90 170 Q 95 175 100 170 Q 105 160 110 170 Q 115 175 120 170 Q 125 160 130 170 Q 135 175 140 170 L 150 140 Q 155 120 150 80 Q 140 40 100 40 Z;
                       M 100 38 Q 60 38 50 78 Q 45 118 52 142 L 52 172 Q 55 173 60 168 Q 65 162 70 168 Q 75 173 80 168 Q 85 162 90 168 Q 95 173 100 168 Q 105 162 110 168 Q 115 173 120 168 Q 125 162 130 168 Q 135 173 140 168 L 148 142 Q 155 118 150 78 Q 140 38 100 38 Z;
                       M 100 40 Q 60 40 50 80 Q 45 120 50 140 L 50 170 Q 55 175 60 170 Q 65 160 70 170 Q 75 175 80 170 Q 85 160 90 170 Q 95 175 100 170 Q 105 160 110 170 Q 115 175 120 170 Q 125 160 130 170 Q 135 175 140 170 L 150 140 Q 155 120 150 80 Q 140 40 100 40 Z"
               dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.6;0.85" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Wispy trails -->
    <path d="M 60 100 Q 40 105 30 100" stroke="#6BB6FF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
      <animate attributeName="d" values="M 60 100 Q 40 105 30 100;M 60 100 Q 40 95 30 90;M 60 100 Q 40 105 30 100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 100 Q 160 105 170 100" stroke="#6BB6FF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
      <animate attributeName="d" values="M 140 100 Q 160 105 170 100;M 140 100 Q 160 95 170 90;M 140 100 Q 160 105 170 100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Eyes (glowing) -->
    <ellipse cx="80" cy="80" rx="10" ry="16" fill="#66D9FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="16;12;16" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="80" rx="10" ry="16" fill="#66D9FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="16;12;16" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Eye centers -->
    <circle cx="80" cy="82" r="5" fill="#FFF">
      <animate attributeName="r" values="5;3;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="82" r="5" fill="#FFF">
      <animate attributeName="r" values="5;3;5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Mouth (hollow) -->
    <ellipse cx="100" cy="115" rx="15" ry="20" fill="#4A90E2" opacity="0.6">
      <animate attributeName="ry" values="20;25;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Arms (wispy) -->
    <path d="M 65 95 Q 45 100 35 110" stroke="#6BB6FF" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 65 95" to="-15 65 95" dur="2.5s" repeatCount="indefinite" direction="alternate"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 135 95 Q 155 100 165 110" stroke="#6BB6FF" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 135 95" to="15 135 95" dur="2.5s" repeatCount="indefinite" direction="alternate"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating particles around the wraith -->
  <circle cx="60" cy="60" r="2" fill="#66D9FF" opacity="0.7">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="70" r="2" fill="#66D9FF" opacity="0.7">
    <animate attributeName="cy" values="70;60;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="50" r="2" fill="#66D9FF" opacity="0.7">
    <animate attributeName="cy" values="50;40;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer glow -->
  <circle cx="100" cy="105" r="75" fill="none" stroke="#6BB6FF" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="75;85;75" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
