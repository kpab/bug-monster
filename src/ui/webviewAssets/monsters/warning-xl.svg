<!-- Warning Bug - Small yellow/orange bug creature -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="35" ry="8" fill="#000" opacity="0.2">
    <animate attributeName="rx" values="35;40;35" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Bug body -->
  <g id="bug-body">
    <!-- Antennae -->
    <g id="left-antenna">
      <path d="M 75 60 Q 65 40 60 25" stroke="#CC8800" stroke-width="3" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="-10 75 60" to="-20 75 60" dur="0.6s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <circle cx="60" cy="25" r="4" fill="#FFA500">
        <animate attributeName="r" values="4;5;4" dur="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g id="right-antenna">
      <path d="M 125 60 Q 135 40 140 25" stroke="#CC8800" stroke-width="3" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="10 125 60" to="20 125 60" dur="0.6s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <circle cx="140" cy="25" r="4" fill="#FFA500">
        <animate attributeName="r" values="4;5;4" dur="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Head -->
    <ellipse cx="100" cy="70" rx="35" ry="30" fill="#FFD700">
      <animate attributeName="ry" values="30;32;30" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Eyes -->
    <ellipse cx="85" cy="65" rx="10" ry="14" fill="#000">
      <animate attributeName="ry" values="14;12;14" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="115" cy="65" rx="10" ry="14" fill="#000">
      <animate attributeName="ry" values="14;12;14" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="87" cy="63" r="3" fill="#FFF"/>
    <circle cx="117" cy="63" r="3" fill="#FFF"/>

    <!-- Smile -->
    <path d="M 88 78 Q 100 83 112 78" stroke="#CC8800" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Body segments -->
    <ellipse cx="100" cy="115" rx="40" ry="35" fill="#FFA500">
      <animate attributeName="ry" values="35;38;35" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="145" rx="35" ry="28" fill="#FFD700">
      <animate attributeName="ry" values="28;30;28" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Stripes on body -->
    <ellipse cx="100" cy="110" rx="35" ry="4" fill="#CC8800" opacity="0.5"/>
    <ellipse cx="100" cy="125" rx="35" ry="4" fill="#CC8800" opacity="0.5"/>
    <ellipse cx="100" cy="140" rx="30" ry="4" fill="#CC8800" opacity="0.5"/>

    <!-- Wings -->
    <g id="left-wing">
      <ellipse cx="70" cy="95" rx="25" ry="40" fill="#FFF" opacity="0.7" stroke="#FFD700" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="-30 70 95" to="-50 70 95" dur="0.15s" repeatCount="indefinite" direction="alternate"/>
      </ellipse>
      <path d="M 70 75 Q 65 90 70 105" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
      <path d="M 75 80 Q 72 90 75 100" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
    </g>
    <g id="right-wing">
      <ellipse cx="130" cy="95" rx="25" ry="40" fill="#FFF" opacity="0.7" stroke="#FFD700" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="30 130 95" to="50 130 95" dur="0.15s" repeatCount="indefinite" direction="alternate"/>
      </ellipse>
      <path d="M 130 75 Q 135 90 130 105" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
      <path d="M 125 80 Q 128 90 125 100" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Legs -->
    <g id="legs" stroke="#CC8800" stroke-width="3" fill="none" stroke-linecap="round">
      <!-- Left legs -->
      <path d="M 70 120 Q 55 130 50 145">
        <animateTransform attributeName="transform" type="rotate" from="0 70 120" to="-10 70 120" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <path d="M 75 130 Q 60 140 55 155">
        <animateTransform attributeName="transform" type="rotate" from="0 75 130" to="-10 75 130" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <path d="M 80 140 Q 65 150 60 165">
        <animateTransform attributeName="transform" type="rotate" from="0 80 140" to="-10 80 140" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>

      <!-- Right legs -->
      <path d="M 130 120 Q 145 130 150 145">
        <animateTransform attributeName="transform" type="rotate" from="0 130 120" to="10 130 120" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <path d="M 125 130 Q 140 140 145 155">
        <animateTransform attributeName="transform" type="rotate" from="0 125 130" to="10 125 130" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>
      <path d="M 120 140 Q 135 150 140 165">
        <animateTransform attributeName="transform" type="rotate" from="0 120 140" to="10 120 140" dur="0.3s" repeatCount="indefinite" direction="alternate"/>
      </path>
    </g>
  </g>

  <!-- Glow/warning aura -->
  <circle cx="100" cy="110" r="60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="60;70;60" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Entire body bounce animation -->
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="0.6s" repeatCount="indefinite" additive="sum"/>
</svg>
